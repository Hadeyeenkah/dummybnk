<svg viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" fill="#0f172a"/>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#123044" opacity="0.9" stroke="#06b6d4" stroke-width="2" />
  
  <!-- Wave/flow element -->
  <path
    d="M 50 128 Q 90 70 128 100 T 206 120"
    stroke="#22d3ee"
    stroke-width="16"
    fill="none"
    stroke-linecap="round"
    opacity="0.9"
  />
  
  <!-- Second wave -->
  <path
    d="M 50 160 Q 90 120 128 145 T 206 165"
    stroke="#0891b2"
    stroke-width="12"
    fill="none"
    stroke-linecap="round"
    opacity="0.6"
  />
  
  <!-- Shield outline -->
  <path
    d="M 128 50 L 180 85 L 180 140 C 180 200 128 220 128 220 C 128 220 76 200 76 140 L 76 85 Z"
    stroke="#06b6d4"
    stroke-width="8"
    fill="none"
    stroke-linejoin="round"
  />
  
  <!-- Check mark -->
  <g opacity="0.8">
    <path
      d="M 110 145 L 125 160 L 155 120"
      stroke="#06b6d4"
      stroke-width="8"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>