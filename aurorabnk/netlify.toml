
[build]
  base = "aurorabnk"
  command = """
    npm ci && \
    npm ci --prefix backend && \
    npm ci --prefix frontend && \
    mkdir -p node_modules && \
    cp -r backend node_modules/ && \
    npm run build --prefix frontend
  """
  publish = "frontend/build"

# Exclude node_modules and markdown docs from secret scanning (false positives)

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "frontend/node_modules/**,backend/node_modules/**,*.md,backend/.env.example,backend/.env.production.example"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,CI"
  MISE_INSTALL_PATH = ""


[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["backend/**"]
  external_node_modules = ["mongoose", "jsonwebtoken", "bcryptjs", "dotenv"]


# API routes must come FIRST, before the catch-all React redirect
[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/profile"
  to = "/.netlify/functions/dashboard-user"
  status = 200
  force = true

[[redirects]]
  from = "/api/transfers"
  to = "/.netlify/functions/transfers"
  status = 200
  force = true

[[redirects]]
  from = "/api/transactions"
  to = "/.netlify/functions/transactions"
  status = 200
  force = true

[[redirects]]
  from = "/api/bills"
  to = "/.netlify/functions/bills"
  status = 200
  force = true

[[redirects]]
  from = "/api/notifications"
  to = "/.netlify/functions/notifications"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat/conversation"
  to = "/.netlify/functions/chat-conversation"
  status = 200
  force = true

[[redirects]]
  from = "/api/dashboard"
  to = "/.netlify/functions/dashboard"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/users"
  to = "/.netlify/functions/admin-users"
  status = 200
  force = true

# Catch-all for React Router (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
